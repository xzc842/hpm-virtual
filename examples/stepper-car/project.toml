mcu = "stc90c51"

[devices.stepper_fl]
driver = "stepper"
step = "P1_0"
dir = "P1_1"

[devices.stepper_fr]
driver = "stepper"
step = "P1_4"
dir = "P1_5"

[devices.stepper_rl]
driver = "stepper"
step = "P1_6"
dir = "P1_7"

[devices.stepper_rr]
driver = "stepper"
step = "P3_2"
dir = "P3_3"

[devices.sonar]
driver = "ultrasonic"
trig = "P1_2"
echo = "P1_3"

[devices.sonar.config]
effective_distance = "50"
max_distance = "400"
loops_per_cm = "42"

